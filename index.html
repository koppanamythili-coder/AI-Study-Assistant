<!DOCTYPE html>
<html>
<head>
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>AI Study Assistant</h1>
    <p class="subtitle">Your simple virtual learning companion</p>

    <div class="card">
        <h2>Ask a Question</h2>
        <input id="question" placeholder="Ask about Python, ML, HTML, CSS or Database">
        <button onclick="askQuestion()">Ask</button>
        <p id="answer"></p>
    </div>

    <div class="card">
        <h2>Practice Quiz</h2>
        <button onclick="loadQuiz()">Start Quiz</button>
        <div id="quiz"></div>
    </div>

    <div class="card">
        <h2>Study Plan</h2>
        <button onclick="loadPlan()">Generate Study Plan</button>
        <div id="plan"></div>
    </div>
</div>

<script>
async function askQuestion() {
    const question = document.getElementById("question").value;
    const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
    });
    const data = await res.json();
    document.getElementById("answer").innerText = data.answer;
}

async function loadQuiz() {
    const res = await fetch("/quiz");
    const data = await res.json();
    let html = "";
    data.forEach((item, i) => {
        html += `<div class="quiz-item"><b>${i+1}. ${item.q}</b>`;
        item.options.forEach(opt => {
            html += `<label><input type="radio" name="q${i}" value="${opt}"> ${opt}</label>`;
        });
        html += `<small>Correct answer: ${item.answer}</small></div>`;
    });
    document.getElementById("quiz").innerHTML = html;
}

async function loadPlan() {
    const res = await fetch("/study-plan");
    const data = await res.json();
    document.getElementById("plan").innerHTML =
        data.map(x => `<p><b>${x.day}:</b> ${x.task}</p>`).join("");
}
</script>
</body>
</html>
